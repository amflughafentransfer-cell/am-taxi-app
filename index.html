<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A&M Schultransport</title>

<style>
*{box-sizing:border-box}
body{
  font-family:Arial,sans-serif;
  background:#f3f5f7;
  margin:0;
  color:#222;
}
header{
  background:#111;
  color:white;
  padding:24px 15px;
  text-align:center;
}
header h1{margin:0;font-size:34px}
header p{margin:8px 0 0;color:#ccc;font-size:20px}
main{max-width:700px;margin:auto;padding:18px}

.card{
  background:white;
  border-radius:20px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 4px 14px rgba(0,0,0,.08);
}
h2{margin-top:0}
.route{color:#666;font-size:18px}
.date{font-size:20px;font-weight:bold;margin:20px 0 10px}

.trip{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:18px 0;
  border-top:1px solid #eee;
  font-size:20px;
}
.buttons{display:flex;align-items:center;gap:10px}
button{
  border:0;
  border-radius:14px;
  width:58px;
  height:58px;
  font-size:25px;
}
.yes{background:#e1f3e5}
.no{background:#f9dddd}
.status{
  width:25px;
  text-align:center;
  font-size:24px;
  font-weight:bold;
}
.reason{
  font-size:14px;
  color:#666;
  margin-top:4px;
}
.summary{text-align:center}
.amount{font-size:36px;font-weight:bold;margin-top:10px}
.month{font-size:16px;line-height:1.8}
</style>
</head>

<body>

<header>
<h1>A&M Taxi Services</h1>
<p>Schultransport</p>
</header>

<main>

<div class="card">
<h2>Jon</h2>
<p class="route">Mettmenstetten → ISR+ Hedingen</p>

<div class="date" id="today"></div>

<div class="trip">
<div>
🌅 Hinfahrt
<div class="reason" id="hinReason"></div>
</div>
<div class="buttons">
<button class="yes" onclick="setTrip('hin','✓')">✓</button>
<button class="no" onclick="setTrip('hin','✕')">×</button>
<span id="hin" class="status">–</span>
</div>
</div>

<div class="trip">
<div>
🏠 Retour
<div class="reason" id="retourReason"></div>
</div>
<div class="buttons">
<button class="yes" onclick="setTrip('retour','✓')">✓</button>
<button class="no" onclick="setTrip('retour','✕')">×</button>
<span id="retour" class="status">–</span>
</div>
</div>
</div>

<div class="card summary">
<h2>Heute</h2>
<p id="todayPrice">Noch keine Fahrt erfasst</p>
<div class="amount" id="amount">CHF 0.–</div>
</div>

<div class="card">
<h2>Monatsübersicht</h2>
<div id="monthList" class="month"></div>
<hr>
<strong id="monthTotal">Total: CHF 0.–</strong>
</div>

</main>

<script>
const HALF_DAY = 75;

const now = new Date();
const dateKey =
  now.getFullYear()+"-"+
  String(now.getMonth()+1).padStart(2,"0")+"-"+
  String(now.getDate()).padStart(2,"0");

document.getElementById("today").innerText =
  now.toLocaleDateString("de-CH",{
    weekday:"long",
    day:"2-digit",
    month:"2-digit",
    year:"numeric"
  });

function getData(){
  return JSON.parse(localStorage.getItem("amSchoolTrips") || "{}");
}

function saveData(data){
  localStorage.setItem("amSchoolTrips",JSON.stringify(data));
}

function setTrip(type,value){
  const data=getData();

  if(!data[dateKey]){
    data[dateKey]={
      hin:"–",
      retour:"–",
      hinReason:"",
      retourReason:""
    };
  }

  if(value==="✓"){
    data[dateKey][type]="✓";
    data[dateKey][type+"Reason"]="";
  } else {

    const answer=prompt(
      "Grund für die nicht gefahrene Strecke:\n\n"+
      "1 = Entschuldigt (CHF 0.–)\n"+
      "2 = Nicht entschuldigt (CHF 75.–)"
    );

    if(answer===null) return;

    if(answer==="1"){
      data[dateKey][type]="✕";
      data[dateKey][type+"Reason"]="Entschuldigt";
    }
    else if(answer==="2"){
      data[dateKey][type]="✕";
      data[dateKey][type+"Reason"]="Nicht entschuldigt";
    }
    else{
      alert("Bitte 1 oder 2 eingeben.");
      return;
    }
  }

  saveData(data);
  render();
}

function tripPrice(status,reason){
  if(status==="✓") return HALF_DAY;
  if(status==="✕" && reason==="Nicht entschuldigt") return HALF_DAY;
  return 0;
}

function calculateDay(day){
  return (
    tripPrice(day.hin,day.hinReason) +
    tripPrice(day.retour,day.retourReason)
  );
}

function render(){
  const data=getData();

  const today=data[dateKey] || {
    hin:"–",
    retour:"–",
    hinReason:"",
    retourReason:""
  };

  document.getElementById("hin").innerText=today.hin;
  document.getElementById("retour").innerText=today.retour;

  document.getElementById("hinReason").innerText=
    today.hinReason || "";

  document.getElementById("retourReason").innerText=
    today.retourReason || "";

  const todayTotal=calculateDay(today);

  document.getElementById("amount").innerText=
    "CHF "+todayTotal+".–";

  if(todayTotal===150){
    document.getElementById("todayPrice").innerText=
      "Total für heute";
  }
  else if(todayTotal===75){
    document.getElementById("todayPrice").innerText=
      "CHF 75.– verrechenbar";
  }
  else{
    document.getElementById("todayPrice").innerText=
      "Noch keine verrechenbare Fahrt";
  }

  let html="";
  let total=0;

  Object.keys(data).sort().forEach(date=>{
    if(!date.startsWith(dateKey.substring(0,7))) return;

    const d=data[date];

    if(d.hinReason===undefined) d.hinReason="";
    if(d.retourReason===undefined) d.retourReason="";

    const price=calculateDay(d);
    total+=price;

    const formattedDate=
      date.substring(8,10)+"."+
      date.substring(5,7)+"."+
      date.substring(0,4);

    html +=
      "<div><strong>"+formattedDate+"</strong><br>"+
      "Hin "+d.hin+
      (d.hinReason ? " ("+d.hinReason+")" : "")+
      " · Retour "+d.retour+
      (d.retourReason ? " ("+d.retourReason+")" : "")+
      " — <strong>CHF "+price+".–</strong></div>";
  });

  if(!html){
    html="Noch keine Fahrten in diesem Monat.";
  }

  document.getElementById("monthList").innerHTML=html;
  document.getElementById("monthTotal").innerText=
    "Total: CHF "+total+".–";
}

render();
</script>

</body>
</html>
