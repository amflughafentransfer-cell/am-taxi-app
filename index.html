<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>A&M Taxi Services</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,Arial,sans-serif;background:#f2f2f4;margin:0;color:#1a1a1a;padding-bottom:78px;}
header{background:#111;color:#fff;padding:20px 16px;text-align:center;position:sticky;top:0;z-index:10;}
header h1{margin:0;font-size:22px;}
header p{margin:4px 0 0;color:#bbb;font-size:13px;}
.gear{position:absolute;right:14px;top:18px;background:none;border:none;color:#fff;font-size:22px;cursor:pointer;}
main{max-width:640px;margin:auto;padding:14px;}
.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.06);}
h2{margin:0 0 12px;font-size:18px;}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
label{display:block;font-size:12px;font-weight:600;color:#666;margin:10px 0 4px;}
label:first-child{margin-top:0;}
input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1.5px solid #ddd;font-size:15px;font-family:inherit;background:#fff;}
textarea{resize:vertical;min-height:50px;}
button{border:0;border-radius:12px;cursor:pointer;font-family:inherit;}
.btn{width:100%;padding:14px;font-size:15px;font-weight:700;background:#111;color:#fff;margin-top:8px;}
.btn-out{background:#fff;color:#111;border:1.5px solid #ccc;}
.btn-danger{background:#fff;color:#d73535;border:1.5px solid #f3caca;}
.btn-nav{background:#eef3fb;color:#1a4a8a;}
.btn-row{display:flex;gap:8px;}
.btn-row .btn{margin-top:8px;}
.small{padding:9px 12px;font-size:13px;width:auto;margin-top:0;}
.name{font-size:22px;font-weight:bold;}
.route{color:#666;font-size:15px;margin:8px 0 16px;}
.date{font-size:17px;font-weight:bold;padding-bottom:12px;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.date input{width:auto;font-size:14px;padding:6px 8px;}
.trip{display:grid;grid-template-columns:1fr 50px 50px 55px;gap:8px;align-items:center;padding:16px 0;border-bottom:1px solid #eee;}
.trip:last-child{border-bottom:none;}
.trip-title{font-size:17px;}
.reason{display:block;color:#666;font-size:12.5px;margin-top:3px;}
.yes,.no{height:48px;font-size:20px;}
.yes{background:#e0f3e5;color:#168b45;}
.no{background:#f8dddd;color:#d73535;}
.status{font-size:20px;text-align:center;}
.amount{font-size:32px;font-weight:bold;margin-top:8px;}
.todayText{font-size:14px;color:#555;}
.nav-row{display:flex;gap:8px;margin-top:12px;}
.nav-btn{flex:1;background:#eef3fb;color:#1a4a8a;padding:14px 4px;font-size:14px;font-weight:700;text-align:center;}
.month-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.month-tile{background:#fafafa;border:1.5px solid #e2e2e2;border-radius:12px;padding:10px 4px;text-align:center;cursor:pointer;}
.month-tile b{display:block;font-size:13px;}
.month-tile span{display:block;font-size:11px;color:#666;margin-top:3px;}
.day-entry{padding:11px 0;border-bottom:1px solid #eee;font-size:13.5px;line-height:1.6;}
.day-entry b{font-size:14.5px;}
.total-line{font-weight:bold;font-size:16px;margin-top:10px;padding-top:10px;border-top:2px solid #333;display:flex;justify-content:space-between;}
.list-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eee;cursor:pointer;}
.list-row:last-child{border-bottom:none;}
.list-title{font-weight:700;font-size:14.5px;}
.list-sub{font-size:12px;color:#777;margin-top:2px;}
.list-amt{font-weight:700;font-size:14px;white-space:nowrap;}
.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ddd;display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));max-width:640px;margin:auto;z-index:20;}
.tab{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:#888;font-size:10.5px;font-weight:700;}
.tab.active{color:#111;}
.tab .ic{font-size:19px;}
.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:10px;background:#eee;color:#555;}
.pill.on{background:#e0f3e5;color:#168b45;}
.pill.archived{background:#f3e6d8;color:#8a5a20;}
.hint{font-size:11.5px;color:#888;margin-top:4px;}
.empty{text-align:center;color:#999;padding:30px 10px;font-size:13.5px;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:100;}
.sheet{background:#fff;border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:640px;max-height:88vh;overflow-y:auto;position:relative;}
.sheet .x{position:absolute;top:14px;right:14px;background:#eee;border:none;width:30px;height:30px;border-radius:50%;font-size:15px;}
.logo-box{width:52px;height:52px;border-radius:10px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#999;flex:none;}
.invoice-head{display:flex;gap:12px;align-items:center;margin-bottom:14px;}
table.inv{width:100%;border-collapse:collapse;font-size:12.5px;margin:10px 0;}
table.inv th{text-align:left;border-bottom:1.5px solid #333;padding:6px 4px;}
table.inv td{padding:6px 4px;border-bottom:1px solid #eee;}

/* ============ RECHNUNG (A4, einheitliche Quelle für Vorschau/Druck/PDF) ============ */
.inv-wrap{background:#eef0f3;padding:14px 0;overflow:hidden;}
.inv-page{
  width:210mm;min-height:297mm;height:297mm;margin:0 auto;background:#fff;
  padding:14mm 13mm 12mm 13mm;box-sizing:border-box;color:#1a2a3a;
  font-family:'Helvetica Neue',Arial,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
}
.inv-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;flex:none;}
.inv-head-left{display:flex;gap:14px;align-items:center;}
.inv-logo{width:56px;height:56px;border-radius:10px;object-fit:contain;flex:none;background:#f5f6f8;padding:3px;}
.inv-company-name{font-size:20px;font-weight:800;color:#0d2a4a;margin:0;letter-spacing:-.2px;}
.inv-company-sub{font-size:12px;font-weight:700;color:#e8622c;margin:2px 0 6px;text-transform:uppercase;letter-spacing:.4px;}
.inv-company-contact{font-size:11px;color:#5a6b7d;line-height:1.5;}
.inv-box{background:#0d2a4a;color:#fff;border-radius:10px;padding:11px 16px;text-align:right;min-width:180px;flex:none;}
.inv-box .inv-label{font-size:14px;font-weight:800;letter-spacing:1.5px;}
.inv-box .inv-meta{font-size:10.5px;color:#c7d3e0;margin-top:7px;}
.inv-box .inv-meta b{color:#fff;font-size:12.5px;display:block;margin-top:1px;}
.inv-info-grid{display:flex;justify-content:space-between;gap:20px;margin:4px 0 12px;padding-bottom:12px;border-bottom:1.5px solid #e3e7ec;flex:none;}
.inv-info-col{flex:1 1 0;min-width:0;}
.inv-info-col .inv-eyebrow{font-size:9.5px;font-weight:800;color:#e8622c;letter-spacing:.8px;text-transform:uppercase;margin-bottom:5px;}
.inv-info-col .inv-name{font-size:13.5px;font-weight:700;color:#0d2a4a;overflow-wrap:anywhere;word-break:break-word;}
.inv-info-col .inv-line{font-size:11.5px;color:#48566a;margin-top:2px;overflow-wrap:anywhere;word-break:break-word;}
.inv-info-col.right{text-align:right;}
.inv-kv{font-size:11.5px;color:#48566a;margin-top:3px;overflow-wrap:anywhere;word-break:break-word;}
.inv-kv b{color:#0d2a4a;}
.inv-tablewrap{flex:0 1 auto;overflow:hidden;min-height:0;}
table.inv-trips{width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed;letter-spacing:normal;}
table.inv-trips th:nth-child(1),table.inv-trips td:nth-child(1){width:16%;}
table.inv-trips th:nth-child(2),table.inv-trips td:nth-child(2){width:9%;}
table.inv-trips th:nth-child(3),table.inv-trips td:nth-child(3){width:48%;}
table.inv-trips th:nth-child(4),table.inv-trips td:nth-child(4){width:27%;}
table.inv-trips thead th{background:#0d2a4a;color:#fff;text-align:left;padding:6px 7px;font-size:10px;letter-spacing:.4px;text-transform:uppercase;}
table.inv-trips thead th:last-child,table.inv-trips td.inv-amt{text-align:right;}
table.inv-trips tbody td{padding:6px 7px;border-bottom:1px solid #eef1f4;overflow:hidden;letter-spacing:normal;}
table.inv-trips tbody tr:nth-child(even){background:#f7f9fb;}
.inv-trip-icon{display:inline-block;vertical-align:-1px;}
.inv-page.dense-1 table.inv-trips tbody td{padding:3.5px 7px;}
.inv-page.dense-1 table.inv-trips{font-size:10px;}
.inv-page.dense-2 table.inv-trips tbody td{padding:2.5px 7px;}
.inv-page.dense-2 table.inv-trips{font-size:9.5px;}
.inv-total-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding:13px 18px;background:#0d2a4a;border-radius:10px;flex:none;}
.inv-total-row .inv-t-label{color:#c7d3e0;font-size:13px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;}
.inv-total-row .inv-t-value{color:#fff;font-size:25px;font-weight:800;}
.inv-total-row .inv-t-value .inv-accent{color:#ff8a4d;}
.inv-pay-section{display:flex;gap:18px;margin-top:16px;flex:none;align-items:flex-start;}
.inv-qr-box{width:38mm;height:38mm;background:#fff;border:1px solid #e3e7ec;border-radius:4px;flex:none;position:relative;overflow:hidden;}
.inv-qr-box img,.inv-qr-box canvas,.inv-qr-box table{width:100% !important;height:100% !important;}
.inv-qr-info{flex:1.3;font-size:10.5px;color:#374556;line-height:1.55;min-width:0;}
.inv-qr-info .inv-eyebrow{font-size:9.5px;font-weight:800;color:#e8622c;letter-spacing:.8px;text-transform:uppercase;margin-bottom:6px;}
.inv-qr-info b{color:#0d2a4a;}
.swiss-cross{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:22px;height:22px;background:#000;display:flex;align-items:center;justify-content:center;border:2px solid #fff;}
.swiss-cross-inner{position:relative;width:12px;height:12px;}
.swiss-cross-inner:before,.swiss-cross-inner:after{content:'';position:absolute;background:#fff;}
.swiss-cross-inner:before{left:4.75px;top:0;width:2.5px;height:12px;}
.swiss-cross-inner:after{left:0;top:4.75px;width:12px;height:2.5px;}
.inv-thanks{flex:1;text-align:right;min-width:0;}
.inv-thanks .inv-script{font-size:21px;color:#e8622c;font-weight:700;font-style:italic;}
.inv-thanks .inv-sub{font-size:11px;color:#5a6b7d;margin-top:5px;}
.inv-badges{font-size:10.5px;color:#0d2a4a;font-weight:700;margin-top:12px;}
.inv-footer{margin-top:14px;padding-top:12px;border-top:1px solid #e3e7ec;text-align:center;font-size:9.5px;color:#8a97a6;flex:none;}
.inv-footer .inv-tag{font-weight:800;color:#0d2a4a;letter-spacing:.5px;margin-top:4px;}
.inv-preview-tag{display:inline-block;font-size:10px;font-weight:700;color:#8a3b00;background:#fff3e8;border:1px solid #ffd8b0;border-radius:6px;padding:2px 8px;margin-left:8px;}

@page{ margin:0; }
@media print{
  header,.tabs,.no-print{display:none!important;}
  body{background:#fff;padding-bottom:0;}
  main{display:none!important;}
  .card{box-shadow:none;border:none;padding:0;}
  .overlay{position:static;background:none;display:block;padding:0;inset:auto;}
  .sheet{border-radius:0;box-shadow:none;padding:0;max-height:none;overflow:visible;width:100%;max-width:100%;background:none;}
  .sheet .x{display:none!important;}
  .inv-wrap{padding:0;background:#fff;height:auto!important;overflow:visible!important;}
  .inv-page{box-shadow:none;margin:0;width:210mm;height:297mm;transform:none!important;}
}
</style>
</head>

/* ============ STORAGE ============ */
function loadJSON(key, fallback){
  try{ var v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function saveJSON(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); return true; }
  catch(e){ console.error('save failed', key, e); return false; }
}

var DB = {
  children: loadJSON('am_children', null),
  trips: loadJSON('am_trips', null),
  customers: loadJSON('am_customers', []),
  taxi: loadJSON('am_taxi', []),
  invoiceSeq: loadJSON('am_invoiceSeq', {}),
  invoices: loadJSON('am_invoices', []),
  meta: loadJSON('am_meta', {})
};

/* ---- one-time migration from legacy single-child amSchoolTrips ---- */
(function migrate(){
  var legacy = null;
  try{ legacy = JSON.parse(localStorage.getItem('amSchoolTrips')); }catch(e){ legacy = null; }

  if(DB.children === null){
    DB.children = [{
      id:'jon', name:'Jon', active:true,
      address:'Untere Bahnhofstrasse 24, 8932 Mettmenstetten',
      school:'ISR+', schoolAddress:'Güpfstrasse 13, 8908 Hedingen',
      route:'Mettmenstetten \u2192 ISR+ Hedingen',
      customerId:null, customerName:'Schulverwaltung Mettmenstetten',
      priceHin:75, priceRetour:75, note:''
    }];
    saveJSON('am_children', DB.children);
  }
  if(DB.trips === null){ DB.trips = {}; }

  if(legacy && !DB.meta.migratedLegacy){
    if(!DB.trips['jon']) DB.trips['jon'] = {};
    Object.keys(legacy).forEach(function(date){
      if(!DB.trips['jon'][date]) DB.trips['jon'][date] = legacy[date];
    });
    DB.meta.migratedLegacy = true;
    saveJSON('am_meta', DB.meta);
    saveJSON('am_trips', DB.trips);
  } else if(DB.trips === null || Object.keys(DB.trips).length===0){
    saveJSON('am_trips', DB.trips);
  }
})();

(function dedupeInvoices(){
  if(DB.meta.dedupedInvoicesV1) return;
  var seen = {};
  var kept = [];
  DB.invoices.slice().sort(function(a,b){
    return a.number.localeCompare(b.number);
  }).forEach(function(inv){
    var key = inv.childId+'|'+inv.monthKey;
    if(!seen[key]){
      seen[key]=true;
      kept.push(inv);
    }
  });

  DB.invoices = kept;

  var maxByMonth = {};
  kept.forEach(function(inv){
    var m = /-(\d+)$/.exec(inv.number);
    if(m){
      var n = parseInt(m[1],10);
      if(!maxByMonth[inv.monthKey] || n > maxByMonth[inv.monthKey]){
        maxByMonth[inv.monthKey] = n;
      }
    }
  });

  Object.keys(maxByMonth).forEach(function(mk){
    DB.invoiceSeq[mk] = Math.max(DB.invoiceSeq[mk] || 0, maxByMonth[mk]);
  });

  DB.meta.dedupedInvoicesV1 = true;
  saveJSON('am_invoices', DB.invoices);
  saveJSON('am_invoiceSeq', DB.invoiceSeq);
  saveJSON('am_meta', DB.meta);
})();

    DB.customers.push(cust);
  }
  var jon = DB.children.find(function(c){ return c.id==='jon' || c.name==='Jon'; });
  if(jon && !jon.customerId){ jon.customerId = cust.id; }
  DB.meta.linkedMettmenstettenV1 = true;
  saveJSON('am_customers', DB.customers);
  saveJSON('am_children', DB.children);
  saveJSON('am_meta', DB.meta);
})();

/* Migration: ältere, bereits erstellte Rechnungen (aus einer früheren Code-Version) hatten die
   Fahrten/Beträge/Empfänger noch nicht dauerhaft mitgespeichert. Hier wird das einmalig sicher
   nachgefüllt - Rechnungsnummer, Kind, Monat und Datum bleiben dabei unangetastet. */
(function migrateInvoiceSnapshotsV1(){
  if(DB.meta.migratedInvoiceSnapshotsV1) return;
  var changed = false;
  DB.invoices.forEach(function(inv){
    var incomplete = !inv.childSnapshot || !inv.recipientSnapshot || !inv.lines || inv.total==null || !inv.monthLabel;
    if(!incomplete) return;
    var parts = inv.monthKey.split('-');
    var fallbackMonthLabel = monthName(Number(parts[1]))+' '+parts[0];
    var child = getChild(inv.childId);
    if(child){
      var built = buildLiveLines(child, inv.monthKey);
      var recipient = resolveRecipient(child);
      if(!inv.childSnapshot) inv.childSnapshot = { name:child.name, route:child.route||'' };
      if(!inv.recipientSnapshot) inv.recipientSnapshot = recipient;
      if(!inv.lines) inv.lines = built.lines;
      if(inv.total==null) inv.total = built.total;
    } else {
      if(!inv.childSnapshot) inv.childSnapshot = { name: inv.childId, route:'' };
      if(!inv.recipientSnapshot) inv.recipientSnapshot = { name:'', street:'', plz:'', ort:'' };
      if(!inv.lines) inv.lines = [];
      if(inv.total==null) inv.total = 0;
    }
    if(!inv.monthLabel) inv.monthLabel = fallbackMonthLabel;
    changed = true;
  });
  DB.meta.migratedInvoiceSnapshotsV1 = true;
  if(changed) saveJSON('am_invoices', DB.invoices);
  saveJSON('am_meta', DB.meta);
})();

function persistAll(){
  saveJSON('am_children', DB.children);
  saveJSON('am_trips', DB.trips);
  saveJSON('am_customers', DB.customers);
  saveJSON('am_taxi', DB.taxi);
  saveJSON('am_invoiceSeq', DB.invoiceSeq);
  saveJSON('am_invoices', DB.invoices);
  saveJSON('am_meta', DB.meta);
}

/* ============ HELPERS ============ */
function pad(n){ return String(n).padStart(2,'0'); }
function todayKey(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function fmtDateDE(iso){ var p=iso.split('-'); return p[2]+"."+p[1]+"."+p[0]; }
function monthKey(iso){ return iso.slice(0,7); }
function monthName(m){ return ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"][m-1]; }
function weekdayLong(iso){ var d = new Date(iso+"T00:00:00"); return d.toLocaleDateString('de-CH',{weekday:'long'}); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function uid(pref){ return pref+'-'+Date.now()+'-'+Math.floor(Math.random()*1000); }
function mapsUrl(addr){ return 'https://maps.apple.com/?daddr=' + encodeURIComponent(addr); }

/* Sicheres Einbetten eines Strings in ein einfach-quotiertes onclick-Attribut */
function attrSafe(s){ return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

/* Google-Maps-Routenplaner mit Start UND Ziel (funktioniert auf iPhone/Safari und im normalen Browser) */
function gmapsDirectionsUrl(origin, destination){
  return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(origin)+'&destination='+encodeURIComponent(destination)+'&travelmode=driving';
}
function openDirections(origin, destination){
  if(!origin || !destination){
    alert('Bitte zuerst Wohnadresse und Schuladresse vollständig erfassen.');
    return;
  }
  window.open(gmapsDirectionsUrl(origin, destination), '_blank');
}

/* Zerlegt eine Adresse wie "Kirchfeld 5" in Strasse + Hausnummer (für Swiss-QR strukturierte Adresse) */
function parseAddressParts(addr){
  addr = (addr||'').trim();
  if(!addr) return {street:'', number:''};
  var m = /^(.*\S)\s+(\d+[a-zA-Z]?)$/.exec(addr);
  if(m) return {street:m[1], number:m[2]};
  return {street:addr, number:''};
}

/* Prüft, ob eine IBAN eine QR-IBAN ist (IID 30000-31999). Nur dann wäre eine QRR-Referenz zulässig. */
function ibanIsQR(iban){
  var digits = (iban||'').replace(/\s/g,'');
  var iid = digits.substr(4,5);
  var n = parseInt(iid,10);
  return n>=30000 && n<=31999;
}

function getChild(id){ return DB.children.find(function(c){ return c.id===id; }); }
function activeChildren(){ return DB.children.filter(function(c){ return c.active!==false; }); }

function tripPrice(child, status, reason, leg){
  var price = leg==='hin' ? (child.priceHin!=null?Number(child.priceHin):75) : (child.priceRetour!=null?Number(child.priceRetour):75);
  if(status==='\u2713') return price;
  if(status==='\u2715' && reason==='Nicht entschuldigt') return price;
  return 0;
}
function dayEntry(childId, date){
  return (DB.trips[childId] && DB.trips[childId][date]) || {hin:'\u2013',retour:'\u2013',hinReason:'',retourReason:''};
}
function dayTotal(child, entry){
  return tripPrice(child, entry.hin, entry.hinReason, 'hin') + tripPrice(child, entry.retour, entry.retourReason, 'retour');
}
function statusText(status, reason){
  if(status==='\u2713') return '\u2713';
  if(status==='\u2715'){
    if(reason==='Entschuldigt') return '\u2715 (Entschuldigt)';
    if(reason==='Nicht entschuldigt') return '\u2715 (Nicht entschuldigt)';
    return '\u2715';
  }
  return '\u2013';
}

function setTrip(leg, value){
  var child = getChild(state.todayChildId);
  var date = state.todayDate;
  if(!DB.trips[child.id]) DB.trips[child.id] = {};
  if(!DB.trips[child.id][date]) DB.trips[child.id][date] = {hin:'\u2013',retour:'\u2013',hinReason:'',retourReason:''};
  var entry = DB.trips[child.id][date];

  if(value==='\u2713'){
    entry[leg] = '\u2713';
    entry[leg+'Reason'] = '';
    persistAll(); render();
    return;
  }
  openReasonSheet(function(reason){
    if(!reason) return;
    entry[leg] = '\u2715';
    entry[leg+'Reason'] = reason;
    persistAll(); render();
  });
}

  years.sort();

  var html = '<div class="card">'+
    '<label>Kind</label>'+

    '<label>Jahr</label>'+

function collectYears(childId){
  var set = {};
  var t = DB.trips[childId] || {};
  Object.keys(t).forEach(function(d){ set[d.slice(0,4)] = true; });
  set[new Date().getFullYear()] = true;
  return Object.keys(set).map(Number);
}

function renderBillYearGrid(child, year){
  var tiles = '';
  var yearTotal = 0;
  for(var m=1;m<=12;m++){
    var mk = year+'-'+pad(m);
    var total = monthTotal(child.id, mk);
    yearTotal += total;
    tiles += '<div class="month-tile" onclick="openBillMonth(\''+mk+'\')"><b>'+monthName(m).slice(0,3)+'</b><span>CHF '+total+'.\u2013</span></div>';
  }
  return '<div class="card"><div class="month-grid">'+tiles+'</div>'+
    '<div class="total-line"><span>Jahrestotal '+year+'</span><span>CHF '+yearTotal+'.\u2013</span></div></div>';
}

function monthTotal(childId, mk){
  var child = getChild(childId);
  var t = DB.trips[childId] || {};
  var total = 0;
  Object.keys(t).forEach(function(d){
    if(d.indexOf(mk)===0) total += dayTotal(child, t[d]);
  });
  return total;
}

function renderBillMonthDetail(child, mk){
  var t = DB.trips[child.id] || {};
  var dates = Object.keys(t).filter(function(d){ return d.indexOf(mk)===0; }).sort();
  var total = 0;
  var rows = dates.map(function(d){
    var e = t[d];
    var p = dayTotal(child, e);
    total += p;
    return '<div class="day-entry"><b>'+fmtDateDE(d)+'</b><br>'+
      'Hin '+statusText(e.hin,e.hinReason)+' \u00b7 Retour '+statusText(e.retour,e.retourReason)+
      ' &mdash; <b>CHF '+p+'.\u2013</b></div>';
  }).join('');
  if(!rows) rows = '<div class="empty">Keine Fahrten in diesem Monat erfasst.</div>';
  var parts = mk.split('-');
  var existingInv = findInvoiceRecord(child.id, mk);
  var invHint = existingInv
    ? '<div class="hint">Rechnung '+esc(existingInv.number)+' ist bereits finalisiert (CHF '+existingInv.total+'.\u2013). Neue Fahrten in diesem Monat wirken sich nicht mehr auf diese Rechnung aus.</div>'
    : '';
  return '<div class="card">'+
    '<div class="row" style="justify-content:space-between;margin-bottom:10px;">'+
      '<h2 style="margin:0;">'+monthName(Number(parts[1]))+' '+parts[0]+'</h2>'+
      '<button class="btn small btn-out" onclick="closeBillMonth()">\u2039 Zurück</button>'+
    '</div>'+
    rows+
    '<div class="total-line"><span>Monatstotal</span><span>CHF '+total+'.\u2013</span></div>'+
    invHint+
    '<button class="btn" onclick="openInvoicePreview(\''+child.id+'\',\''+mk+'\')">'+(existingInv?'Rechnung anzeigen (finalisiert)':'Rechnungsvorschau ansehen')+'</button>'+
  '</div>';
}

/* ============ RECHNUNG / DRUCKANSICHT ============ */
function nextInvoiceNumber(mk){
  var n = (DB.invoiceSeq[mk]||0)+1;
  DB.invoiceSeq[mk]=n;
  persistAll();
  return formatInvNum(mk,n);
}
function formatInvNum(mk,n){ return 'AM-'+mk+'-'+String(n).padStart(3,'0'); }

/* Prüft, ob ein Monat (Format YYYY-MM) bereits vollständig vergangen ist.
   Solange der Monat noch läuft, gilt er als "nicht abgeschlossen". */
function isMonthComplete(mk){
  return todayKey().slice(0,7) > mk;
}

function findInvoiceRecord(childId, mk){
  return DB.invoices.find(function(i){ return i.childId===childId && i.monthKey===mk; });
}
function customerById(id){ return DB.customers.find(function(c){return c.id===id;}); }

/* Empfänger-Adresse: bevorzugt verknüpfter Kunde, sonst reiner Freitext-Name (keine erfundene Adresse) */
function resolveRecipient(child){
  var cust = child.customerId ? customerById(child.customerId) : null;
  if(cust){
    return { name:cust.name, street:cust.address||'', plz:cust.plz||'', ort:cust.ort||'' };
  }
  return { name: child.customerName || '', street:'', plz:'', ort:'' };
}

/* Fahrten + Total für einen Monat aus den AKTUELL gespeicherten Fahrten (nur für die Vorschau vor dem Einfrieren) */
function buildLiveLines(child, mk){
  var t = DB.trips[child.id] || {};
  var dates = Object.keys(t).filter(function(d){ return d.indexOf(mk)===0; }).sort();
  var total = 0;
  var lines = dates.map(function(d){
    var e = t[d]; var p = dayTotal(child, e); total += p;
    return { date:d, hinText: statusText(e.hin,e.hinReason), retourText: statusText(e.retour,e.retourReason), amount:p };
  });
  return { lines:lines, total: total };
}

/* Baut das Anzeige-Modell: entweder aus dem eingefrorenen Snapshot (bereits finalisierte Rechnung)
   oder live aus den aktuellen Fahrten (reine Vorschau, noch keine Nummer vergeben).
   Das reine Öffnen dieser Vorschau verändert NIE etwas in DB.invoices - erst finalizeInvoiceRecord tut das. */
function buildInvoiceModel(childId, mk){
  var child = getChild(childId);
  var existing = findInvoiceRecord(childId, mk);
  var parts = mk.split('-');
  var monthLabel = monthName(Number(parts[1]))+' '+parts[0];

  if(existing){
    return {
      frozen:true,
      invNum: existing.number,
      date: existing.date,
      child: existing.childSnapshot,
      recipient: existing.recipientSnapshot,
      lines: existing.lines,
      total: existing.total,
      monthLabel: existing.monthLabel
    };
  }

  var built = buildLiveLines(child, mk);
  var recipient = resolveRecipient(child);
  var previewNum = formatInvNum(mk, (DB.invoiceSeq[mk]||0)+1);
  return {
    frozen:false,
    invNum: previewNum,
    date: todayKey(),
    child: { name:child.name, route:child.route||'' },
    recipient: recipient,
    lines: built.lines,
    total: built.total,
    monthLabel: monthLabel
  };
}

/* Rechnung endgültig finalisieren: friert Fahrten/Beträge/Empfänger dauerhaft ein, vergibt die Nummer
   genau einmal. Existiert für Kind+Monat bereits eine finalisierte Rechnung, wird diese unverändert
   zurückgegeben (verhindert doppelte Rechnungen für denselben Kunden/Monat). */
function finalizeInvoiceRecord(childId, mk){
  var existing = findInvoiceRecord(childId, mk);
  if(existing) return existing;

  var child = getChild(childId);
  var built = buildLiveLines(child, mk);
  var recipient = resolveRecipient(child);
  var parts = mk.split('-');
  var monthLabel = monthName(Number(parts[1]))+' '+parts[0];
  var num = nextInvoiceNumber(mk);

  var record = {
    number: num,
    childId: childId,
    monthKey: mk,
    date: todayKey(),
    childSnapshot: { name:child.name, route:child.route||'' },
    recipientSnapshot: recipient,
    lines: built.lines,
    total: built.total,
    monthLabel: monthLabel
  };
  DB.invoices.push(record);
  persistAll();
  return record;
}

/* Setzt eine bereits finalisierte Monatsrechnung zurück (z.B. wenn sie versehentlich zu früh
   erstellt wurde und noch nicht verschickt wurde). Fahrten, Kinder, Kunden, Taxi-Buch, Einstellungen
   und Backups bleiben davon vollständig unberührt - es wird ausschliesslich der Eintrag in
   DB.invoices für genau dieses Kind+Monat entfernt.
   WICHTIG zur Nummerierung: DB.invoiceSeq[mk] wird beim Zurücksetzen bewusst NICHT verringert.
   Der Zähler ist ein reines Hochwasserzeichen (high-water mark) und darf über die gesamte Lebensdauer
   der App für einen Monat nur steigen, nie sinken. Dadurch kann eine einmal vergebene Rechnungsnummer
   niemals ein zweites Mal ausgegeben werden - auch nicht nach einem Reset und auch nicht Monate oder
   Jahre später. Die nächste Finalisierung für diesen Monat erhält garantiert eine neue, bisher nie
   verwendete Nummer. */
function resetInvoiceRecord(childId, mk){
  var existing = findInvoiceRecord(childId, mk);
  if(!existing) return;
  var ok = confirm(
    'Rechnung '+existing.number+' (CHF '+existing.total+'.\u2013) wirklich zurücksetzen?\n\n'+
    'Die Vorschau zeigt danach wieder live alle aktuell erfassten Fahrten dieses Monats. '+
    'Bitte nur zurücksetzen, wenn diese Rechnung noch NICHT an den Kunden verschickt wurde.\n\n'+
    'Die Nummer '+existing.number+' selbst wird dabei für immer reserviert bleiben und niemals '+
    'erneut vergeben - die nächste finalisierte Rechnung erhält automatisch eine neue Nummer.'
  );
  if(!ok) return;

  DB.invoices = DB.invoices.filter(function(i){ return !(i.childId===childId && i.monthKey===mk); });
  /* DB.invoiceSeq[mk] bleibt absichtlich unverändert - siehe Kommentar oben. */

  persistAll();
  closeModal();
  render();
}

/* Kleine, schriftunabhängige SVG-Symbole statt Unicode-Zeichen (verhindert Zeichen-/Abstandsfehler beim PDF-Rendering) */
var ICON_CHECK = '<svg class="inv-trip-icon" width="11" height="11" viewBox="0 0 16 16"><path d="M2.5 8.5l4 4 7-8" fill="none" stroke="#168b45" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var ICON_CROSS = '<svg class="inv-trip-icon" width="11" height="11" viewBox="0 0 16 16"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" fill="none" stroke="#c0392b" stroke-width="2.1" stroke-linecap="round"/></svg>';
function iconizeStatus(text){
  if(text==null) return '\u2013';
  return String(text).replace(/\u2713/g, ICON_CHECK).replace(/\u2715/g, ICON_CROSS);
}

/* ============ SWISS QR-RECHNUNG (SPC-Payload nach offizieller Spezifikation) ============ */
/* Baut den QR-Zahlteil-Payload für die jeweilige Rechnung. Gibt null zurück, wenn die IBAN eine
   QR-IBAN wäre, für die aber keine gültige QRR-Referenznummer hinterlegt ist (in diesem Fall wird
   NIEMALS eine erfundene Referenz erzeugt - siehe renderSwissQRInto). Für die tatsächlich hinterlegte
   IBAN (normale IBAN, keine QR-IBAN) wird korrekt der Referenztyp "NON" verwendet. */
function buildSwissQRPayload(model){
  if(ibanIsQR(COMPANY.iban)) return null;

  var lines = [];
  lines.push('SPC');
  lines.push('0200');
  lines.push('1');
  lines.push(COMPANY.iban.replace(/\s/g,''));

  var credParts = parseAddressParts(COMPANY.street);
  lines.push('S');
  lines.push(COMPANY.name.substring(0,70));
  lines.push(credParts.street.substring(0,70));
  lines.push(credParts.number.substring(0,16));
  lines.push(COMPANY.plz.substring(0,16));
  lines.push(COMPANY.ort.substring(0,35));
  lines.push(COMPANY.country||'CH');

  /* Ultimate Creditor - laut Spezifikation reserviert, muss leer bleiben */
  for(var i=0;i<7;i++) lines.push('');

  var amt = Number(model.total||0);
  lines.push(amt.toFixed(2));
  lines.push('CHF');

  var rec = model.recipient || {};
  if(rec.name && rec.street){
    var dParts = parseAddressParts(rec.street);
    lines.push('S');
    lines.push(String(rec.name).substring(0,70));
    lines.push(dParts.street.substring(0,70));
    lines.push(dParts.number.substring(0,16));
    lines.push(String(rec.plz||'').substring(0,16));
    lines.push(String(rec.ort||'').substring(0,35));
    lines.push('CH');
  } else {
    for(var j=0;j<7;j++) lines.push('');
  }

  lines.push('NON');
  lines.push('');

  var msg = 'Rechnung '+model.invNum+' - '+model.child.name+' '+model.monthLabel;
  lines.push(msg.substring(0,140));
  lines.push('EPD');

  return lines.join('\r\n');
}

/* Zeichnet den Swiss-QR-Code inkl. Schweizer Kreuz in den übergebenen Container. Läuft synchron
   (qrcodejs zeichnet sofort), kann daher direkt nach dem Einfügen ins DOM aufgerufen werden. */
function renderSwissQRInto(containerId, model){
  var el = document.getElementById(containerId);
  if(!el) return;
  el.innerHTML = '';
  var payload = buildSwissQRPayload(model);
  if(!payload){
    el.innerHTML = '<div style="font-size:9px;color:#c0392b;padding:6px;line-height:1.4;">QR-Zahlteil nicht verfügbar: QR-IBAN ohne hinterlegte gültige Referenznummer.</div>';
    return;
  }
  try{
    new QRCode(el, { text: payload, width:280, height:280, correctLevel: QRCode.CorrectLevel.M });
  }catch(e){
    el.innerHTML = '<div style="font-size:9px;color:#c0392b;padding:6px;">QR-Code konnte nicht erzeugt werden.</div>';
    return;
  }
  var cross = document.createElement('div');
  cross.className = 'swiss-cross';
  cross.innerHTML = '<div class="swiss-cross-inner"></div>';
  el.appendChild(cross);
}

/* Prüft in einem unsichtbaren Klon anhand der GESAMTEN Seitenhöhe, ob alles auf eine A4-Seite passt;
   wählt bei Bedarf eine kompaktere Tabellen-Stufe, ohne die Schrift unleserlich klein zu machen */
function pickDenseClass(innerHtml){
  var probe = document.createElement('div');
  probe.style.position='fixed'; probe.style.left='-9999px'; probe.style.top='0';
  probe.innerHTML = '<div class="inv-page" id="denseProbe">'+innerHtml+'</div>';
  document.body.appendChild(probe);
  var page = probe.querySelector('.inv-page');
  var maxPx = 297 * 96 / 25.4; // A4-Höhe in CSS-Pixeln (~1122.5px)
  var chosen = 'dense-2';
  ['', 'dense-1', 'dense-2'].some(function(cls){
    page.className = 'inv-page' + (cls? ' '+cls:'');
    var fits = page.scrollHeight <= maxPx;
    chosen = cls;
    return fits;
  });
  document.body.removeChild(probe);
  return chosen;
}

var _finalizeLock = false;

/* Öffnet die Rechnungs-Vorschau. Solange keine finalisierte Rechnung existiert, ist dies IMMER
   eine reine Live-Ansicht auf Basis von DB.trips - identisch zur Abrechnung-Ansicht - und schreibt
   nichts in DB.invoices. Erst der ausdrückliche Klick auf "Rechnung jetzt finalisieren" (siehe
   createAndShowInvoice) legt einen dauerhaften Eintrag an. */
function openInvoicePreview(childId, mk){
  try{
    var model = buildInvoiceModel(childId, mk);
    var qrId = 'invoiceQRBox';
    var inner = renderInvoicePageInner(model, qrId);
    var denseClass = pickDenseClass(inner);

    var actionButtons = model.frozen
      ? ('<button class="btn no-print" onclick="printInvoice(\''+childId+'\',\''+mk+'\')">Drucken</button>'+
         '<button class="btn btn-out no-print" onclick="shareInvoicePDF(\''+childId+'\',\''+mk+'\')">Als PDF teilen / per E-Mail senden</button>'+
         '<button class="btn btn-danger no-print" onclick="resetInvoiceRecord(\''+childId+'\',\''+mk+'\')">Rechnung zurücksetzen (falls noch nicht verschickt)</button>')
      : ('<button class="btn no-print" onclick="createAndShowInvoice(\''+childId+'\',\''+mk+'\')">Rechnung jetzt finalisieren (Nummer vergeben)</button>');

    showModal(
      '<div class="inv-wrap" id="invoiceWrap">'+
        '<div class="inv-page '+denseClass+'" id="invoicePage">'+inner+'</div>'+
      '</div>'+
      actionButtons+
      '<button class="btn btn-out no-print" onclick="closeModal()">Schliessen</button>'
    );
    renderSwissQRInto(qrId, model);
    fitInvoicePreviewToScreen();
  }catch(e){
    alert('Die Rechnung konnte nicht angezeigt werden:\n'+(e && e.message ? e.message : e));
  }
}

/* Skaliert die A4-Rechnung so, dass sie komplett auf den Bildschirm passt (kein horizontales Scrollen mehr nötig).
   Betrifft NUR die Bildschirm-Vorschau; Drucken und PDF-Teilen verwenden weiterhin die echte A4-Originalgrösse. */
function fitInvoicePreviewToScreen(){
  var wrap = document.getElementById('invoiceWrap');
  var page = document.getElementById('invoicePage');
  if(!wrap || !page) return;
  page.style.transform = 'none';
  var available = wrap.clientWidth;
  var naturalW = page.offsetWidth;
  var naturalH = page.offsetHeight;
  if(!available || !naturalW) return;
  var scale = Math.min(1, available / naturalW);
  page.style.transformOrigin = 'top left';
  page.style.transform = 'scale('+scale+')';
  wrap.style.height = Math.ceil(naturalH * scale) + 'px';
}
window.addEventListener('resize', function(){
  if(document.getElementById('invoicePage')) fitInvoicePreviewToScreen();
});

/* Bewusstes Finalisieren: zeigt IMMER zuerst eine Sicherheitsabfrage - je nachdem, ob der Monat
   bereits abgeschlossen ist, mit der passenden Warnung. Erst nach Bestätigung wird die Rechnung
   eingefroren. Ein einfacher Sperrmechanismus (_finalizeLock) verhindert zusätzlich, dass ein
   sehr schnelles Mehrfachtippen zwei Finalisierungen gleichzeitig anstösst. */
function createAndShowInvoice(childId, mk){
  if(_finalizeLock) return;
  _finalizeLock = true;
  try{
    var parts = mk.split('-');
    var label = monthName(Number(parts[1]))+' '+parts[0];
    var msg;
    if(!isMonthComplete(mk)){
      msg = 'Achtung: Der Monat '+label+' ist noch nicht abgeschlossen.\n\n'+
            'Spätere Fahrten werden nach der Finalisierung nicht mehr in diese Rechnung aufgenommen.\n\n'+
            'Trotzdem finalisieren?';
    } else {
      msg = 'Möchten Sie diese Monatsrechnung ('+label+') wirklich finalisieren?\n\n'+
            'Nach der Finalisierung bleiben Rechnungsnummer, Fahrten und Betrag unverändert.';
    }
    if(!confirm(msg)) return;
    finalizeInvoiceRecord(childId, mk);
    openInvoicePreview(childId, mk);
  } finally {
    _finalizeLock = false;
  }
}

function printInvoice(childId, mk){
  // window.print() muss synchron im Klick-Handler aufgerufen werden, sonst blockiert iOS Safari es lautlos.
  try{
    finalizeInvoiceRecord(childId, mk);
    window.print();
  }catch(e){
    alert('Drucken konnte nicht gestartet werden:\n'+(e && e.message ? e.message : e));
  }
}

/* Rendert die eingefrorene Rechnung 1:1 (identisch zur Vorschau) in einen Offscreen-Container und liefert ihn zurück */
async function renderOffscreenInvoice(childId, mk){
  var model = buildInvoiceModel(childId, mk);
  var qrId = 'invoiceQRBoxOffscreen';
  var inner = renderInvoicePageInner(model, qrId);
  var denseClass = pickDenseClass(inner);

  var holder = document.createElement('div');
  holder.style.position='fixed'; holder.style.left='-9999px'; holder.style.top='0';
  holder.innerHTML = '<div class="inv-page '+denseClass+'" id="offscreenInvoicePage">'+inner+'</div>';
  document.body.appendChild(holder);
  var pageEl = holder.querySelector('.inv-page');

  // Auf vollständiges Laden des Logos warten, bevor gerendert wird
  var imgs = pageEl.querySelectorAll('img');
  await Promise.all(Array.prototype.map.call(imgs, function(img){
    if(img.complete) return Promise.resolve();
    return new Promise(function(res){ img.onload=res; img.onerror=res; });
  }));

  renderSwissQRInto(qrId, model);
  await new Promise(function(res){ requestAnimationFrame(function(){ requestAnimationFrame(res); }); });

  return { holder: holder, pageEl: pageEl, model: model };
}

async function shareInvoicePDF(childId, mk){
  if(typeof html2canvas === 'undefined' || !window.jspdf){
    alert('Die für PDF/Teilen benötigten Zusatz-Bausteine konnten nicht geladen werden (keine Internetverbindung beim Öffnen der Seite?). Bitte Internetverbindung prüfen, Seite komplett neu laden und nochmal versuchen.');
    return;
  }
  try{
    finalizeInvoiceRecord(childId, mk);
    var off = await renderOffscreenInvoice(childId, mk);
    try{
      var canvas = await html2canvas(off.pageEl, {scale:2, useCORS:true, backgroundColor:'#ffffff'});
      var doc = new window.jspdf.jsPDF({unit:'mm', format:'a4'});
      var imgData = canvas.toDataURL('image/jpeg', 0.95);
      doc.addImage(imgData, 'JPEG', 0, 0, 210, 297);
      var blob = doc.output('blob');
      var filename = 'AM_Rechnung_'+off.model.child.name+'_'+mk+'.pdf';

      var shared = false;
      if(navigator.canShare){
        try{
          var file = new File([blob], filename, {type:'application/pdf'});
          if(navigator.canShare({files:[file]})){
            await navigator.share({files:[file], title:'Rechnung '+off.model.child.name+' '+mk});
            shared = true;
          }
        }catch(shareErr){
          // Nutzer hat Teilen-Menü abgebrochen oder Teilen nicht möglich - kein Fehleralarm nötig
          if(shareErr && shareErr.name === 'AbortError'){ shared = true; }
        }
      }
      if(!shared){
        var url = URL.createObjectURL(blob);
        window.open(url, '_blank');
      }
    } finally {
      document.body.removeChild(off.holder);
    }
  }catch(e){
    alert('PDF/Teilen ist fehlgeschlagen:\n'+(e && e.message ? e.message : e));
  }
}

    note: document.getElementById('tx-note').value.trim()
  };
  if(id){
    var idx = DB.taxi.findIndex(function(x){return x.id===id;});
    if(idx>-1) DB.taxi[idx] = Object.assign({}, DB.taxi[idx], data);
  } else {
    DB.taxi.push(Object.assign({id:uid('taxi')}, data));
  }
  persistAll();
  state.taxiView='list'; render();
}
function deleteTaxi(id){
  if(!confirm('Diese Fahrt wirklich löschen?')) return;
  DB.taxi = DB.taxi.filter(function(x){return x.id!==id;});
  persistAll();
  state.taxiView='list'; render();
}

  }).join('');

function editCustomer(id){ state.custEditId=id; state.custView='form'; render(); }

/* ============ SETTINGS (Kinder + Backup) ============ */
function openSettings(){
  showModal(renderSettings());
}
function renderSettings(){
  var rows = DB.children.map(function(c){
    return '<div class="list-row" onclick="editChild(\''+c.id+'\')">'+
      '<div><div class="list-title">'+esc(c.name)+' <span class="pill '+(c.active!==false?'on':'')+'">'+(c.active!==false?'aktiv':'inaktiv')+'</span>'+
      (c.archived?' <span class="pill archived">archiviert</span>':'')+'</div>'+
      '<div class="list-sub">'+esc(c.route||'')+'</div></div><div class="list-amt">\u203a</div></div>';
  }).join('') || '<div class="empty">Keine Kinder erfasst.</div>';

  return '<h2>Kinder / Aufträge</h2>'+rows+
    '<button class="btn btn-out" onclick="closeModal();newChild();">+ Kind hinzufügen</button>'+
    '<h2 style="margin-top:22px;">Backup</h2>'+
    '<button class="btn" onclick="exportBackup()">Backup als JSON exportieren</button>'+
    '<label>Backup-Datei wiederherstellen</label>'+
    '<input type="file" id="importFile" accept="application/json">'+
    '<button class="btn btn-out" onclick="importBackup()">Backup importieren</button>';
}
function newChild(){ showModal(renderChildForm(null)); }
function editChild(id){ closeModal(); showModal(renderChildForm(id)); }
function renderChildForm(id){
  var c = id ? getChild(id) : {name:'',address:'',school:'',schoolAddress:'',route:'',customerName:'',priceHin:75,priceRetour:75,note:'',active:true,archived:false};
  return '<h2>'+(id?'Kind bearbeiten':'Neues Kind')+'</h2>'+
    (c.archived?'<div class="hint" style="margin-bottom:10px;">Dieser Auftrag ist aktuell archiviert (alte Fahrten/Rechnungen bleiben erhalten und einsehbar). Häkchen bei „Aktiv" setzen, um ihn wieder in die tägliche Auswahl aufzunehmen.</div>':'')+
    '<label>Name</label><input type="text" id="ch-name" value="'+esc(c.name)+'">'+
    '<label>Wohnadresse</label><input type="text" id="ch-address" value="'+esc(c.address||'')+'">'+
    '<label>Schule</label><input type="text" id="ch-school" value="'+esc(c.school||'')+'">'+
    '<label>Schuladresse</label><input type="text" id="ch-schoolAddress" value="'+esc(c.schoolAddress||'')+'">'+
    '<label>Route (Anzeige)</label><input type="text" id="ch-route" value="'+esc(c.route||'')+'">'+
    '<label>Kunde/Auftraggeber</label><input type="text" id="ch-customerName" value="'+esc(c.customerName||'')+'">'+
    '<div class="row"><div style="flex:1;"><label>Preis Hin CHF</label><input type="number" id="ch-priceHin" value="'+(c.priceHin!=null?c.priceHin:75)+'"></div>'+
    '<div style="flex:1;"><label>Preis Retour CHF</label><input type="number" id="ch-priceRetour" value="'+(c.priceRetour!=null?c.priceRetour:75)+'"></div></div>'+
    '<label>Bemerkung</label><textarea id="ch-note">'+esc(c.note||'')+'</textarea>'+
    '<label style="display:flex;align-items:center;gap:8px;"><input type="checkbox" id="ch-active" '+(c.active!==false?'checked':'')+' style="width:auto;"> Aktiv</label>'+
    '<button class="btn" onclick="saveChild('+(id?"'"+id+"'":'null')+')">Speichern</button>'+
    (id ? '<button class="btn btn-danger" onclick="deleteChild(\''+id+'\')">Kind löschen / archivieren</button>' : '')+
    '<button class="btn btn-out" onclick="closeModal();openSettings();">\u2039 Zurück</button>';
}
function saveChild(id){
  var data = {
    name: document.getElementById('ch-name').value.trim(),
    address: document.getElementById('ch-address').value.trim(),
    school: document.getElementById('ch-school').value.trim(),
    schoolAddress: document.getElementById('ch-schoolAddress').value.trim(),
    route: document.getElementById('ch-route').value.trim(),
    customerName: document.getElementById('ch-customerName').value.trim(),
    priceHin: Number(document.getElementById('ch-priceHin').value) || 0,
    priceRetour: Number(document.getElementById('ch-priceRetour').value) || 0,
    note: document.getElementById('ch-note').value.trim(),
    active: document.getElementById('ch-active').checked
  };
  if(!data.name){ alert('Bitte einen Namen eingeben.'); return; }
  if(id){
    var idx = DB.children.findIndex(function(x){return x.id===id;});
    if(idx>-1){
      var merged = Object.assign({}, DB.children[idx], data);
      if(data.active) merged.archived = false; // Reaktivierung hebt Archivierung automatisch auf
      DB.children[idx] = merged;
    }
  } else {
    var newId = uid('child');
    DB.children.push(Object.assign({id:newId, customerId:null, archived:false}, data));
    if(!DB.trips[newId]) DB.trips[newId] = {};
  }
  persistAll();
  closeModal(); openSettings(); render();
}

/* Löschen eines Kindes: nur dann WIRKLICH entfernen, wenn keinerlei Fahrten oder Rechnungen existieren.
   Andernfalls wird der Auftrag stattdessen archiviert (active:false, archived:true) - so bleiben alte
   Fahrten und Rechnungen für diesen Auftrag jederzeit nachvollziehbar (keine Datenleichen, kein
   Verlust der Zuordnung Name/Adresse zu bereits gestellten Rechnungen). */
function deleteChild(id){
  var child = getChild(id);
  if(!child) return;
  var hasTrips = DB.trips[id] && Object.keys(DB.trips[id]).length>0;
  var hasInvoices = DB.invoices.some(function(i){return i.childId===id;});

  if(!hasTrips && !hasInvoices){
    if(!confirm('„'+child.name+'" wirklich vollständig löschen? Es sind keine Fahrten oder Rechnungen vorhanden, das Löschen ist daher unbedenklich.')) return;
    DB.children = DB.children.filter(function(x){return x.id!==id;});
    persistAll();
    closeModal(); openSettings(); render();
    return;
  }

  var ok = confirm(
    '„'+child.name+'" hat bereits gespeicherte Fahrten und/oder Rechnungen.\n\n'+
    'Damit alte Rechnungen und Fahrten weiterhin nachvollziehbar bleiben, wird dieser Auftrag NICHT endgültig '+
    'gelöscht, sondern als „archiviert" markiert und aus der täglichen Auswahl (Heute) entfernt. Alle bisherigen '+
    'Daten (Fahrten, Rechnungen, Adressen) bleiben vollständig erhalten und in der Abrechnung weiterhin einsehbar.\n\n'+
    'Jetzt archivieren?'
  );
  if(!ok) return;
  child.active = false;
  child.archived = true;
  persistAll();
  closeModal(); openSettings(); render();
}

/* ============ BACKUP ============ */
function exportBackup(){
  var payload = {
    exportedAt: new Date().toISOString(),
    am_children: DB.children, am_trips: DB.trips, am_customers: DB.customers,
    am_taxi: DB.taxi, am_invoiceSeq: DB.invoiceSeq, am_invoices: DB.invoices, am_meta: DB.meta
  };
  var blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'AM_Backup_'+todayKey()+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);}, 4000);
}

/* Prüft Struktur UND grobe Typen der Backup-Datei, BEVOR irgendetwas übernommen wird.
   Gibt bei einem Problem eine verständliche Fehlermeldung zurück (String), sonst null. */
function validateBackupData(data){
  if(!data || typeof data !== 'object' || Array.isArray(data)){
    return 'Die Datei enthält keine gültigen Backup-Daten (kein JSON-Objekt erkannt).';
  }
  var checks = [
    ['am_children', function(v){ return Array.isArray(v); }],
    ['am_trips', function(v){ return v && typeof v==='object' && !Array.isArray(v); }],
    ['am_customers', function(v){ return Array.isArray(v); }],
    ['am_taxi', function(v){ return Array.isArray(v); }],
    ['am_invoiceSeq', function(v){ return v && typeof v==='object' && !Array.isArray(v); }],
    ['am_invoices', function(v){ return Array.isArray(v); }],
    ['am_meta', function(v){ return v && typeof v==='object' && !Array.isArray(v); }]
  ];
  for(var i=0;i<checks.length;i++){
    var key = checks[i][0], test = checks[i][1];
    if(!(key in data)) return 'Die Datei enthält kein Feld "'+key+'".';
    if(!test(data[key])) return 'Das Feld "'+key+'" hat ein ungültiges Format.';
  }
  for(var j=0;j<data.am_children.length;j++){
    var c = data.am_children[j];
    if(!c || typeof c!=='object' || !c.id || !c.name){
      return 'Ein Kind-Eintrag in der Datei ist unvollständig (fehlende ID oder Name).';
    }
  }
  for(var k=0;k<data.am_invoices.length;k++){
    var inv = data.am_invoices[k];
    if(!inv || typeof inv!=='object' || !inv.number || !inv.childId || !inv.monthKey){
      return 'Ein Rechnungs-Eintrag in der Datei ist unvollständig.';
    }
  }
  return null;
}

function importBackup(){
  var input = document.getElementById('importFile');
  if(!input.files || !input.files[0]){ alert('Bitte zuerst eine Backup-Datei auswählen.'); return; }
  var reader = new FileReader();
  reader.onload = function(e){
    var data;
    try{
      data = JSON.parse(e.target.result);
    }catch(err){
      alert('Diese Datei konnte nicht gelesen werden: kein gültiges JSON.\n\nDeine bestehenden Daten wurden NICHT verändert.');
      return;
    }
    var validationError = validateBackupData(data);
    if(validationError){
      alert('Diese Backup-Datei ist ungültig oder unvollständig:\n\n'+validationError+'\n\nDeine bestehenden Daten wurden NICHT verändert.');
      return;
    }
    if(!confirm('Achtung: Vorhandene Daten werden vollständig mit dem Inhalt dieser Backup-Datei überschrieben. Fortfahren?')) return;
    try{
      DB.children = data.am_children;
      DB.trips = data.am_trips;
      DB.customers = data.am_customers;
      DB.taxi = data.am_taxi;
      DB.invoiceSeq = data.am_invoiceSeq;
      DB.invoices = data.am_invoices;
      DB.meta = data.am_meta;
      persistAll();
      alert('Backup erfolgreich wiederhergestellt.');
      closeModal(); render();
    }catch(applyErr){
      alert('Beim Übernehmen des Backups ist ein Fehler aufgetreten. Bitte Backup-Datei prüfen.');
    }
  };
  reader.onerror = function(){
    alert('Die Datei konnte nicht gelesen werden.\n\nDeine bestehenden Daten wurden NICHT verändert.');
  };
  reader.readAsText(input.files[0]);
}

/* ============ INIT ============ */
render();
</script>
