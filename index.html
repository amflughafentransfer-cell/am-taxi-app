<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A&M Schultransport</title>

<style>
*{box-sizing:border-box}

body{
  font-family:Arial,sans-serif;
  background:#f3f5f7;
  margin:0;
  color:#222;
}

header{
  background:#111;
  color:white;
  padding:28px 15px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:34px;
}

header p{
  margin:10px 0 0;
  color:#ccc;
  font-size:21px;
}

main{
  max-width:700px;
  margin:auto;
  padding:18px;
}

.card{
  background:white;
  border-radius:20px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 4px 14px rgba(0,0,0,.08);
}

h2{
  margin-top:0;
}

.name{
  font-size:26px;
  font-weight:bold;
}

.route{
  color:#666;
  font-size:18px;
  margin:22px 0;
}

.date{
  font-size:20px;
  font-weight:bold;
  padding-bottom:15px;
  border-bottom:1px solid #ddd;
}

.trip{
  display:grid;
  grid-template-columns:1fr 55px 55px 35px;
  gap:10px;
  align-items:center;
  padding:18px 0;
  border-bottom:1px solid #eee;
}

.trip:last-child{
  border-bottom:none;
}

.trip-title{
  font-size:22px;
}

.reason{
  display:block;
  color:#666;
  font-size:14px;
  margin-top:4px;
}

button{
  border:0;
  border-radius:14px;
  height:55px;
  font-size:25px;
  cursor:pointer;
}

.yes{
  background:#e0f3e5;
  color:#168b45;
}

.no{
  background:#f8dddd;
  color:#d73535;
}

.status{
  font-size:27px;
  text-align:center;
}

.today{
  text-align:center;
}

.today h2{
  font-size:27px;
}

.todayText{
  font-size:17px;
}

.amount{
  font-size:38px;
  font-weight:bold;
  margin-top:16px;
}

.overview-title{
  font-size:27px;
  margin-bottom:22px;
}

.day-entry{
  padding:13px 0;
  border-bottom:1px solid #ddd;
  line-height:1.7;
}

.day-date{
  font-weight:bold;
  font-size:17px;
}

.month-total{
  font-weight:bold;
  font-size:19px;
  margin-top:15px;
  padding-top:10px;
  border-top:2px solid #333;
}

.note{
  color:#666;
  font-size:14px;
}
</style>
</head>

<body>

<header>
  <h1>A&M Taxi Services</h1>
  <p>Schultransport</p>
</header>

<main>

<div class="card">

  <div class="name">Jon</div>

  <div class="route">
    Mettmenstetten → ISR+ Hedingen
  </div>

  <div class="date" id="today"></div>

  <div class="trip">

    <div class="trip-title">
      🌅 Hinfahrt
      <span class="reason" id="hinReason"></span>
    </div>

    <button class="yes"
      onclick="setTrip('hin','✓')">✓</button>

    <button class="no"
      onclick="setTrip('hin','✕')">×</button>

    <div class="status" id="hinStatus">–</div>

  </div>

  <div class="trip">

    <div class="trip-title">
      🏠 Retour
      <span class="reason" id="retourReason"></span>
    </div>

    <button class="yes"
      onclick="setTrip('retour','✓')">✓</button>

    <button class="no"
      onclick="setTrip('retour','✕')">×</button>

    <div class="status" id="retourStatus">–</div>

  </div>

</div>


<div class="card today">

  <h2>Heute</h2>

  <div class="todayText" id="todayText">
    Noch keine verrechenbare Fahrt
  </div>

  <div class="amount" id="todayAmount">
    CHF 0.–
  </div>

</div>


<div class="card">

  <h2 class="overview-title">
    Monatsübersicht
  </h2>

  <div id="monthList">
    Noch keine Fahrten in diesem Monat.
  </div>

  <div class="month-total" id="monthTotal">
    Total: CHF 0.–
  </div>

</div>

</main>


<script>

const PRICE_HALF = 75;
const PRICE_FULL = 150;

const now = new Date();

const dateKey =
  now.getFullYear()+"-"+
  String(now.getMonth()+1).padStart(2,"0")+"-"+
  String(now.getDate()).padStart(2,"0");


document.getElementById("today").innerText =
  now.toLocaleDateString("de-CH",{
    weekday:"long",
    day:"2-digit",
    month:"2-digit",
    year:"numeric"
  });


function getData(){

  try{
    return JSON.parse(
      localStorage.getItem("amSchoolTrips")
    ) || {};
  }
  catch(e){
    return {};
  }

}


function saveData(data){

  localStorage.setItem(
    "amSchoolTrips",
    JSON.stringify(data)
  );

}


function setTrip(type,value){

  const data=getData();

  if(!data[dateKey]){

    data[dateKey]={
      hin:"–",
      retour:"–",
      hinReason:"",
      retourReason:""
    };

  }


  if(value==="✓"){

    data[dateKey][type]="✓";
    data[dateKey][type+"Reason"]="";

  }

  else{

    const answer=prompt(
      "Grund für die nicht gefahrene Strecke:\n\n"+
      "1 = Entschuldigt (CHF 0.–)\n"+
      "2 = Nicht entschuldigt (CHF 75.–)"
    );


    if(answer===null){
      return;
    }


    if(answer==="1"){

      data[dateKey][type]="✕";
      data[dateKey][type+"Reason"]="Entschuldigt";

    }

    else if(answer==="2"){

      data[dateKey][type]="✕";
      data[dateKey][type+"Reason"]="Nicht entschuldigt";

    }

    else{

      alert("Bitte nur 1 oder 2 eingeben.");
      return;

    }

  }


  saveData(data);
  render();

}


function tripPrice(status,reason){

  if(status==="✓"){
    return PRICE_HALF;
  }

  if(
    status==="✕" &&
    reason==="Nicht entschuldigt"
  ){
    return PRICE_HALF;
  }

  return 0;

}


function calculateDay(d){

  if(!d) return 0;

  return (
    tripPrice(d.hin,d.hinReason) +
    tripPrice(d.retour,d.retourReason)
  );

}


function statusText(status,reason){

  if(status==="✓"){
    return "✓";
  }

  if(status==="✕"){

    if(reason==="Entschuldigt"){
      return "✕ (Entschuldigt)";
    }

    if(reason==="Nicht entschuldigt"){
      return "✕ (Nicht entschuldigt)";
    }

    return "✕";

  }

  return "–";

}


function formatDate(date){

  return (
    date.substring(8,10)+"."+
    date.substring(5,7)+"."+
    date.substring(0,4)
  );

}


function render(){

  const data=getData();

  const todayData =
    data[dateKey] || {
      hin:"–",
      retour:"–",
      hinReason:"",
      retourReason:""
    };


  document.getElementById("hinStatus").innerText =
    todayData.hin;

  document.getElementById("retourStatus").innerText =
    todayData.retour;


  document.getElementById("hinReason").innerText =
    todayData.hinReason || "";

  document.getElementById("retourReason").innerText =
    todayData.retourReason || "";


  const todayPrice =
    calculateDay(todayData);


  document.getElementById("todayAmount").innerText =
    "CHF "+todayPrice+".–";


  let text="Noch keine verrechenbare Fahrt";


  if(todayPrice===150){

    text="Hin & Retour verrechenbar";

  }

  else if(todayPrice===75){

    text="CHF 75.– verrechenbar";

  }


  document.getElementById("todayText").innerText=text;



  let html="";
  let total=0;

  const currentMonth =
    dateKey.substring(0,7);


  Object.keys(data)
    .sort()
    .forEach(date=>{

      if(!date.startsWith(currentMonth)){
        return;
      }

      const d=data[date];

      const price=calculateDay(d);

      total+=price;


      html +=
        '<div class="day-entry">'+

        '<div class="day-date">'+
        formatDate(date)+
        '</div>'+

        '<div>'+
        'Hin '+statusText(d.hin,d.hinReason)+
        ' · Retour '+statusText(d.retour,d.retourReason)+
        ' — <strong>CHF '+price+'.–</strong>'+
        '</div>'+

        '</div>';

    });


  if(!html){

    html=
      '<div class="note">'+
      'Noch keine Fahrten in diesem Monat.'+
      '</div>';

  }


  document.getElementById("monthList").innerHTML=html;

  document.getElementById("monthTotal").innerText=
    "Total: CHF "+total+".–";

}


render();

</script>

</body>
</html>
